cv:
  name: 黃楷奇
  headline: 資工碩士生 · 大型語言模型系統 · Kubernetes 排程
  location: 台中，台灣
  email: kaichi4work@gmail.com
  phone: tel:+886-909-480-946
  website: https://hackmd.io/@kaichi
  social_networks:
  - network: GitHub
    username: k7term1a
  sections:
    個人簡介:
    - 資訊工程碩士生，於國網中心從事大型語言模型研究與基礎設施相關工作。具備 LLM 概念驗證實驗（模型合併、差分隱私）、多代理資料流程、電腦視覺應用，以及 Kubernetes 啟發式排程的實作經驗。
    教育背景:
    - institution: 國立中興大學
      area: 資訊工程學系
      degree: 碩士
      location: 台中
      start_date: 2025-09
      end_date: present
    - institution: 國立台中教育大學
      area: 資訊工程學系
      degree: 學士
      location: 台中
      start_date: 2021-09
      end_date: 2025-06
    工作經驗:
    - company: 國家高速網路與計算中心（NCHC）
      position: 大型語言模型團隊 實習生
      location: 台灣
      start_date: 2025-03
      end_date: present
      highlights:
      - 研究大型語言模型最新技術並實作概念驗證（PoC），主題包含差分隱私與**模型合併（model merging）**。
      - 使用 LAMBDA 多代理框架設計並實作語料蒐集流程，用於自動化**資料擷取**與結構化儲存。
    - company: Claireye Intelligence Co.
      position: AI 應用實習生
      location: 台灣
      start_date: 2025-02
      end_date: 2025-06
      highlights:
      - 使用 YOLOv11 開發電腦視覺概念驗證應用，包括消防裝備穿戴順序偵測與工業缺陷檢測。
      - 參與資料標註流程，並實作基於 **OCR** 的資訊擷取於視覺應用中。
    專案經歷:
    - name: 港口船舶排程決策 PoC（航港大數據競賽 第一名作品）
      start_date: 2026-07
      end_date: 2026-08
      highlights:
      - 颱風封港前撤離排序：以 **Soft Mixture-of-Experts PPO** 依「艘數／噸位／風險」三維偏好產生 Pareto 排程候選，action mask 硬限制封港截止與拖船容量；held-out 900 組配對中 **15/15 偏好點優於 FCFS**（平均 +2.46%），安全違規 0。
      - 高雄港產能衝擊 what-if：**NSGA-II** 多目標排程並以 CP-SAT 交叉驗證，20 艘案例商船總等待 **−4.5%**、排程完成時間 **−10.8%**。
      - '[github.com/NCHU-ICTALab/typhoon-evacuation-rl](https://github.com/NCHU-ICTALab/typhoon-evacuation-rl) · [port-resilience-whatif](https://github.com/NCHU-ICTALab/port-resilience-whatif)'
    - name: HPC 叢集建置與效能調校（HiPAC 2024 冠軍作品）
      date: 2024
      highlights:
      - 六人團隊自建 **Infiniband + 多 GPU** 叢集，含 NUMA binding、MPI 調校與 **Prometheus / Grafana** 監控；我負責標準題與應用題的參數優化。
      - 撰寫自動化腳本記錄並分析參數與效能關聯，調校 **HPL / HPCG** benchmark，並從原始碼建置 PIConGPU 與 NAMD、優化多節點 CUDA 執行參數。
    - name: Kubernetes 混合式啟發式排程
      start_date: 2024-11
      end_date: 2025-02
      highlights:
      - 結合蟻群演算法（ACO）與**蚱蜢最佳化（Grasshopper Optimization）**，用於 Kubernetes 批次排程，並以 **Apache YuniKorn** 排程器進行評估。
      - 實驗顯示蚱蜢最佳化可將 ACO 收斂速度提升**近 50%**，而 ACO 則提升了蚱蜢演算法的排程品質。
      - '[github.com/k7term1a/ntcu114-yunikorn-core](https://github.com/k7term1a/ntcu114-yunikorn-core/tree/ntcu114-project)'
    - name: 基於 LAMBDA 的 HF 資料集擷取器
      date: 2026-01
      highlights:
      - 使用 LAMBDA 框架開發多代理流程，**自動擷取**並處理 Hugging Face 資料集。
      - 建立資料集取得與結構化整理的**自動化流程**，支援 LLM 語料建構。
      - '[github.com/k7term1a/hf_extractor_LAMBDA](https://github.com/k7term1a/hf_extractor_LAMBDA)'
    技術能力:
    - label: 程式語言
      details: Python、C/C++、Java
    - label: 人工智慧與機器學習
      details: 大型語言模型（LLMs）、深度學習（Transformers、LSTMs、CNN）、強化學習（PPO、多目標）、電腦視覺（YOLO）、啟發式最佳化（蟻群演算法、NSGA-II）
    - label: 函式庫
      details: PyTorch、Scikit-learn、XGBoost / CatBoost、Pandas、OpenCV
    - label: 系統與 HPC
      details: Slurm、Kubernetes、Prometheus、Grafana、MPI、CUDA、Infiniband、HPL/HPCG
    獎項與榮譽:
    - label: 第一名（2026）
      details: AWS Summit Taipei 2026 AI Hackathon 航運物流組（陽明海運題）— 船隊能效決策平台，負責資料清洗與 CatBoost 油耗模型（WAPE 3.34%）
    - label: 第一名（2026）
      details: 第六屆航港大數據創意應用競賽 學生組（交通部航港局，隊名 SpaceY）— 負責颱風撤離 RL 與港口韌性 NSGA-II 兩個子系統
    - label: 季軍（2025）
      details: 第四屆國網盃應用程式效能優化競賽（HiPAC 2025）— 負責 Slurm 建置與 DCGM/Prometheus/Grafana 監控、LAMMPS 調參、SU2 隱藏題
    - label: 冠軍（2024）
      details: 第三屆國網盃應用程式效能優化競賽（HiPAC 2024）— GPU/Infiniband 叢集建置與 HPL、HPCG、NAMD 調校
    - label: 銀獎（2024）
      details: 2024 全國智慧製造大數據分析競賽（IMBD，70 餘隊）— 表面瑕疵四分類 CNN，負責資料增強與訓練腳本，F1 0.994
    - label: 第三名（2023）
      details: 2023 教育大數據分析競賽（教育部，全國 40 餘隊）— 以線上學習行為預測學習成效並提供預警，XGBoost 準確率 81.8%
