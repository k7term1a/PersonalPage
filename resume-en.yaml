      location: Taiwan
      start_date: 2025-03
      end_date: present
      highlights:
      - Explored recent research on large language models and implemented proof-of-concept experiments
        on differential privacy and **model merging**.
      - Designed and implemented a corpus-collection pipeline using the LAMBDA multi-agent framework for
        automated **data extraction** and structured storage.
    - company: Claireye Intelligence Co.
      position: AI Application Intern
      location: Taiwan
      start_date: 2025-02
      end_date: 2025-06
      highlights:
      - Developed proof-of-concept computer vision applications with YOLOv11, including firefighter gear-wearing
        sequence detection and industrial defect inspection.
      - Participated in dataset annotation and implemented **OCR-based** information extraction for vision
        applications.
    projects:
    - name: Hybrid Metaheuristic Scheduling for Kubernetes
      start_date: 2024-11
      end_date: 2025-02
      highlights:
      - Combined Ant Colony Optimization (ACO) with **Grasshopper Optimization** for Kubernetes batch
        scheduling, evaluated on the **Apache YuniKorn** scheduler.
      - Grasshopper Optimization accelerated ACO convergence by **nearly 50%**, while ACO improved the
        solution quality of Grasshopper-based scheduling.
      - '[github.com/k7term1a/ntcu114-yunikorn-core](https://github.com/k7term1a/ntcu114-yunikorn-core/tree/ntcu114-project)'
    - name: HF Datasets Extractor with LAMBDA
      date: 2026-01
      highlights:
      - Built a multi-agent pipeline on the LAMBDA framework to **automatically extract** and process
        datasets from Hugging Face.
      - Automated dataset retrieval and structured data preparation for LLM corpus construction.
      - '[github.com/k7term1a/hf_extractor_LAMBDA](https://github.com/k7term1a/hf_extractor_LAMBDA)'
