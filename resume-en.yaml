    summary:
    - Graduate student in computer science working on large language model research and infrastructure
      at NCHC. Hands-on experience with LLM proof-of-concept experiments (model merging, differential
      privacy), multi-agent data pipelines, computer vision applications, and metaheuristic scheduling
      on Kubernetes.
