    experience:
    - company: National Center for High-performance Computing (NCHC)
      position: LLM Model Team Intern
      location: Taiwan
      start_date: 2025-03
      end_date: present
      highlights:
      - Conducted an LLM **literature survey** (corpus construction, instruction-data synthesis, Traditional Chinese
        evaluation, catastrophic forgetting, safety alignment) and built PoCs on **model merging (mergekit)** and a
        FineWeb-Edu-style Traditional Chinese educational-text classifier.
      - Self-hosted a gitlab-runner and built a **GitLab CI/CD** pipeline that checks Notion records and backs up
        Hugging Face datasets; built a corpus-collection pipeline on the LAMBDA multi-agent framework.
      - Connected a video action-recognition service to a Dify agent via **MCP**; profiled the latency path and cut
        end-to-end p50 latency from 26.3 s to **10.8 s (−59%)**.
    - company: Claireye Intelligence Co.
      position: AI Application Intern
      location: Taiwan
      start_date: 2025-02
      end_date: 2025-06
      highlights:
      - Developed proof-of-concept computer vision applications with YOLOv11, including firefighter gear-wearing
        sequence detection and industrial defect inspection.
      - Participated in dataset annotation and implemented **OCR-based** information extraction for vision
        applications.
    projects:
    - name: Port Vessel Scheduling Decision PoC (1st place, Maritime & Port Big Data Competition)
      start_date: 2026-07
      end_date: 2026-08
      highlights:
      - Typhoon pre-closure evacuation ordering with a **Soft Mixture-of-Experts PPO** policy conditioned on count/tonnage/risk preferences; action masks enforce closure deadline and tug capacity. On 900 held-out paired scenarios, RL beat FCFS at **15/15 preference points** (+2.46% avg.) with zero safety violations.
      - Kaohsiung port capacity-shock what-if with **NSGA-II** multi-objective scheduling cross-checked by CP-SAT; on a 20-vessel case, total merchant waiting **−4.5%** and makespan **−10.8%** vs. the rule baseline.
      - '[github.com/NCHU-ICTALab/typhoon-evacuation-rl](https://github.com/NCHU-ICTALab/typhoon-evacuation-rl) · [port-resilience-whatif](https://github.com/NCHU-ICTALab/port-resilience-whatif)'
    - name: Hybrid Metaheuristic Scheduling for Kubernetes
      start_date: 2024-11
      end_date: 2025-02
      highlights:
      - Combined Ant Colony Optimization (ACO) with **Grasshopper Optimization** for Kubernetes batch
        scheduling, evaluated on the **Apache YuniKorn** scheduler.
      - Grasshopper Optimization accelerated ACO convergence by **nearly 50%**, while ACO improved the
        solution quality of Grasshopper-based scheduling.
      - '[github.com/k7term1a/ntcu114-yunikorn-core](https://github.com/k7term1a/ntcu114-yunikorn-core/tree/ntcu114-project)'
